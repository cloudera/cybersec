# ---------------------------------------------------------------------------
# On demand enrichment job
#
# Reads a bounded set of already indexed log events, re-runs the combined
# enrichment chain over them and writes the result back through the Hive
# TableApi indexer.  All of the flink-enrichment-combined settings still apply,
# because this job reuses that pipeline.
# ---------------------------------------------------------------------------

# Kafka connection used for the enrichment commands, threatq input and scoring rules.
kafka.bootstrap.servers=localhost:9092
kafka.client.id=ondemand-enrichment
kafka.group.id=ondemand-enrichment
kafka.auto.offset.reset=earliest
kafka.acks=all

schema.registry.url=http://localhost:7788/api/v1

# The combined enrichment reads its enrichment commands from this topic.
enrichment.topic.input=enrichment.command
# The combined enrichment writes enrichment command responses here.
enrichment.topic.query.output=enrichment.command.response

# ThreatQ and scoring rule inputs used by the combined enrichment pipeline.
threatq.topic.input=threatq.input
query.input.topic=scoring.rules
query.output.topic=scoring.rules.result

# Input of the combined enrichment pipeline (broadcast lookups) - required by the reused chain.
topic.input=parser.output

# The log events to re-enrich.
logevents.table=cyber.events
logevents.ts-column=ts
logevents.source-column=source
# Epoch milliseconds, inclusive.
logevents.start-ts=1704067200000
logevents.end-ts=1704153600000
# Comma separated list of source values to select.
logevents.sources=squid,dns

# Output writer: reuse the Hive TableApi indexer.
flink.writer=TableAPI
flink.output-connector=hive

# Hive connection for both reading the log events and writing the output.
hive.confdir=/etc/hive/conf
hive.dbname=cyber

# TableApi indexer output configuration.
flink.tables-init-file=/path/to/table-config.json
flink.mapping-file=/path/to/mapping-config.json

# Lookup / enrichment configuration files required by the combined chain.
lookups.config.file=/path/to/enrichments-lookups.json
hbase.enabled=false
rest.enabled=false
threatq.enabled=false
stellar.enabled=false

parallelism=2
checkpoint.interval.ms=60000
